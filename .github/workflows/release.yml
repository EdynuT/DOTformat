name: Release builds

# Runs whenever a version tag (v1.2.3) is pushed. Builds DOTformat with Nuitka
# on Windows and Linux, packages every variant, and publishes them all to a
# GitHub Release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Set version
        shell: bash
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          # Nuitka's Windows version resource wants four dot-separated integers
          # (e.g. 3.0.0.0); tags are plain vX.Y.Z, so just append a build number.
          echo "NUITKA_VERSION=${GITHUB_REF_NAME#v}.0" >> "$GITHUB_ENV"

      - name: Build Nuitka onefile
        shell: bash
        run: python -m src.utils.build_nuitka --onefile --app-version "$NUITKA_VERSION"

      - name: Package Nuitka onefile
        shell: bash
        run: |
          mkdir -p artifacts
          cp nuitka/DOTformat.exe "artifacts/DOTformat-${VERSION}-x86_64-windows-nuitka-onefile.exe"
          rm -rf nuitka

      - name: Build Nuitka standalone
        shell: bash
        run: python -m src.utils.build_nuitka --app-version "$NUITKA_VERSION"

      - name: Package Nuitka standalone
        shell: bash
        run: |
          mv nuitka/main.dist nuitka/DOTformat
          cd nuitka
          7z a -tzip "../artifacts/DOTformat-${VERSION}-x86_64-windows-nuitka-standalone.zip" DOTformat

      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: artifacts/*

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        # aarch64 (not the "arm64" spelling) to match `uname -m` and the AUR
        # PKGBUILD's `arch=('x86_64' 'aarch64')`, which these assets feed directly.
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Set version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          # Nuitka's Windows version resource wants four dot-separated integers
          # (e.g. 3.0.0.0); tags are plain vX.Y.Z, so just append a build number.
          # Applied on Linux too even though it's a no-op there, so both jobs
          # pass the same --app-version and stay easy to diff.
          echo "NUITKA_VERSION=${GITHUB_REF_NAME#v}.0" >> "$GITHUB_ENV"

      - name: Build Nuitka onefile
        run: python -m src.utils.build_nuitka --onefile --app-version "$NUITKA_VERSION"

      - name: Package Nuitka onefile
        run: |
          mkdir -p artifacts
          cp nuitka/DOTformat "artifacts/DOTformat-${VERSION}-${{ matrix.arch }}-linux-nuitka-onefile"
          chmod +x "artifacts/DOTformat-${VERSION}-${{ matrix.arch }}-linux-nuitka-onefile"
          rm -rf nuitka

      - name: Build Nuitka standalone
        run: python -m src.utils.build_nuitka --app-version "$NUITKA_VERSION"

      - name: Package Nuitka standalone
        run: |
          mv nuitka/main.dist nuitka/DOTformat
          tar -czf "artifacts/DOTformat-${VERSION}-${{ matrix.arch }}-linux-nuitka-standalone.tar.gz" -C nuitka DOTformat

      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds-${{ matrix.arch }}
          path: artifacts/*

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
